# Samba 配置示例：可用于 samba-ui 的本地演示。
# 保存时，注释、空行以及未知参数都会被保留。

[global]
   workgroup = WORKGROUP
   server string = Samba Server %v
   netbios name = NAS
   security = user
   map to guest = Bad User
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000
   unix charset = UTF-8

[public]
   comment = 公共只读目录
   path = /srv/samba/public
   browseable = yes
   read only = yes
   guest ok = yes

[homes]
   comment = 用户主目录
   browseable = no
   read only = no
   valid users = %S

[test]
   comment = 我的
   path = /test

   read only = yes
   guest ok = yes
[test2]
   comment = 我的2
   path = /test2
