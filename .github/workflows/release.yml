name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            asset: samba-ui-armv7-musl
          - target: armv7-unknown-linux-gnueabihf
            asset: samba-ui-armv7-glibc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with cross
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/samba-ui" "dist/${{ matrix.asset }}"
          chmod 0755 "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-armv6:
    name: Build samba-ui-armv6-musl
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-musleabihf

      - name: Build static ARMv6
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          LLD="$(rustc --print sysroot)/lib/rustlib/${HOST}/bin/rust-lld"
          if [ ! -x "$LLD" ]; then
            sudo apt-get update
            sudo apt-get install -y lld
            LLD="$(command -v ld.lld)"
          fi
          echo "Using linker: $LLD"

          CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER="$LLD" \
          CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS="-C link-arg=--threads=1" \
            cargo build --locked --release --target arm-unknown-linux-musleabihf

          mkdir -p dist
          cp target/arm-unknown-linux-musleabihf/release/samba-ui dist/samba-ui-armv6-musl
          chmod 0755 dist/samba-ui-armv6-musl
          file dist/samba-ui-armv6-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: samba-ui-armv6-musl
          path: dist/samba-ui-armv6-musl
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-armv6]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml version: $VERSION"
          echo "Git tag:            $GITHUB_REF_NAME"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml 版本 $VERSION 不一致"
            exit 1
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"

          rm -rf pkg
          mkdir -p pkg/deploy pkg/examples
          cp dist/samba-ui-armv6-musl pkg/
          cp dist/samba-ui-armv7-musl pkg/
          cp dist/samba-ui-armv7-glibc pkg/
          cp README.md pkg/
          cp deploy/install.sh deploy/samba-ui.service deploy/samba-ui.env.example pkg/deploy/
          cp examples/smb.conf pkg/examples/

          (
            cd pkg
            sha256sum samba-ui-armv6-musl samba-ui-armv7-musl samba-ui-armv7-glibc README.md > SHA256SUMS
            zip -9 -r "../dist/samba-ui-${VERSION}-armhf.zip" .
          )

          (
            cd dist
            sha256sum samba-ui-armv6-musl samba-ui-armv7-musl samba-ui-armv7-glibc "samba-ui-${VERSION}-armhf.zip" > SHA256SUMS
          )

          ls -l dist
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "samba-ui $GITHUB_REF_NAME" \
              --generate-notes
          fi
